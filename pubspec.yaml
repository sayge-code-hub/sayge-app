name: sayge_app
description: "Sayge mobile and web app built with Flutter, BLoC, and clean architecture."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dartz: ^0.10.1
  get_it: ^9.3.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2
  intl: ^0.20.3
  supabase_flutter: ^2.18.0
  flutter_dotenv: ^6.0.1
  go_router: ^17.5.0
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^13.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Non-dot path so Netlify (and similar) do not strip it from deploys.
    - assets/config/app.env
    - assets/images/sayge_logo.webp
    - assets/images/sayge_logo.png
    - assets/images/sayge_icon.png
    - assets/images/proposal_signature.png

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
