name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

# Skip re-entry when the version-bump commit is pushed ([skip ci] in message).
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump build number (+1)
        id: bump
        run: |
          set -euo pipefail
          line="$(grep -E '^version:' pubspec.yaml | head -1)"
          name="$(echo "$line" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')"
          build="$(echo "$line" | sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)/\1/')"
          next=$((build + 1))
          sed -i -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+/version: ${name}+${next}/" pubspec.yaml
          echo "version=${name}+${next}" >> "$GITHUB_OUTPUT"
          echo "Bumped version to ${name}+${next}"
          grep -E '^version:' pubspec.yaml

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (CanvasKit from CDN)
        run: |
          flutter build web --release --base-href / --web-resources-cdn --no-wasm-dry-run
          # Drop local CanvasKit (~37MB); runtime loads from gstatic CDN.
          rm -rf build/web/canvaskit
          # Avoid stale service-worker caches on Netlify.
          node -e "
            const fs = require('fs');
            const p = 'build/web/flutter_bootstrap.js';
            let t = fs.readFileSync(p, 'utf8');
            t = t.replace(
              /_flutter\.loader\.load\(\{[\s\S]*?\}\);/,
              '_flutter.loader.load({ config: {} });'
            );
            fs.writeFileSync(p, t);
          "

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./build/web
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ steps.bump.outputs.version }} (${{ github.sha }})"
          enable-commit-comment: false
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
