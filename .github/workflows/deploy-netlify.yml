name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

# Skip re-entry for version-bump merges (those PRs only sync pubspec after deploy).
jobs:
  deploy:
    if: >-
      ${{
        !contains(github.event.head_commit.message, '[skip ci]')
        && !startsWith(github.event.head_commit.message, 'chore: bump version')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gate production: never bump/deploy if analyze or tests fail.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Bump patch version (x.y.Z)
        id: bump
        run: |
          set -euo pipefail
          line="$(grep -E '^version:' pubspec.yaml | head -1)"
          # Accept "1.2.3" or legacy "1.2.3+9"; always write three-part semver.
          name="$(echo "$line" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          major="$(echo "$name" | cut -d. -f1)"
          minor="$(echo "$name" | cut -d. -f2)"
          patch="$(echo "$name" | cut -d. -f3)"
          next_patch=$((patch + 1))
          next="${major}.${minor}.${next_patch}"
          sed -i -E "s/^version:.*/version: ${next}/" pubspec.yaml
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Bumped version to ${next}"
          grep -E '^version:' pubspec.yaml

      # Build/deploy must not depend on pushing to protected main. Version bump
      # lands via PR after deploy (branch rules require Analyze & test).
      - name: Build web (CanvasKit from CDN)
        run: |
          flutter build web --release --base-href / --web-resources-cdn --no-wasm-dry-run --no-tree-shake-icons
          # Drop local CanvasKit (~37MB); runtime loads from gstatic CDN.
          rm -rf build/web/canvaskit
          # Avoid stale service-worker caches on Netlify.
          # Also content-hash MaterialIcons so browsers cannot keep a prior
          # tree-shaken font at the stable path across deploys.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const p = 'build/web/flutter_bootstrap.js';
            let t = fs.readFileSync(p, 'utf8');
            t = t.replace(
              /_flutter\.loader\.load\(\{[\s\S]*?\}\);/,
              '_flutter.loader.load({ config: {} });'
            );
            fs.writeFileSync(p, t);

            const fontsDir = 'build/web/assets/fonts';
            const oldName = 'MaterialIcons-Regular.otf';
            const oldPath = path.join(fontsDir, oldName);
            if (fs.existsSync(oldPath)) {
              const hash = crypto
                .createHash('sha1')
                .update(fs.readFileSync(oldPath))
                .digest('hex')
                .slice(0, 8);
              const newName = 'MaterialIcons-Regular.' + hash + '.otf';
              // Keep the stable path (old caches) and also publish a hashed
              // copy that FontManifest will point at after revalidation.
              fs.copyFileSync(oldPath, path.join(fontsDir, newName));
              const fmPath = 'build/web/assets/FontManifest.json';
              const fm = JSON.parse(fs.readFileSync(fmPath, 'utf8'));
              for (const family of fm) {
                if (!family.fonts) continue;
                for (const font of family.fonts) {
                  if (typeof font.asset === 'string' && font.asset.endsWith(oldName)) {
                    font.asset = font.asset.replace(oldName, newName);
                  }
                }
              }
              fs.writeFileSync(fmPath, JSON.stringify(fm));
              for (const manifestName of [
                'AssetManifest.json',
                'AssetManifest.bin.json',
              ]) {
                const mp = path.join('build/web/assets', manifestName);
                if (!fs.existsSync(mp)) continue;
                let body = fs.readFileSync(mp, 'utf8');
                if (body.includes(oldName)) {
                  body = body.split(oldName).join(newName);
                  fs.writeFileSync(mp, body);
                }
              }
              console.log('MaterialIcons cache-busted as', newName);
            }
          "

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./build/web
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ steps.bump.outputs.version }} (${{ github.sha }})"
          enable-commit-comment: false
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Open version-bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          branch="chore/bump-${version}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add pubspec.yaml
          # Do not put [skip ci] here — main requires Analyze & test to merge.
          git commit -m "chore: bump version to ${version}"
          git push -u origin "HEAD:${branch}"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: bump version to ${version}" \
            --body "Automated post-deploy version bump from Deploy to Netlify.")"
          gh pr merge "$pr_url" --auto --merge || true
